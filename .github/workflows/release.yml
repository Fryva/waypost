name: Release

# Publish to npm when a version tag is pushed. Create the tag with
# `git tag -a vX.Y.Z -m ...` (X.Y.Z must equal package.json's version) and
# `git push origin vX.Y.Z`. Requires a repository secret NPM_TOKEN — an npm
# Automation access token (npmjs.com → Access Tokens → Generate New Token →
# Classic → Automation). Automation tokens publish without a 2FA one-time code.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # the full suite takes about 25 min on a hosted runner (2026-10-11)
    permissions:
      contents: write  # the GitHub Release below
      id-token: write   # lets npm attach build provenance to the release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The tag and package.json must name the same version, or a mistagged
      # push would publish something the tag does not describe.
      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json ${pkg}" >&2
            exit 1
          fi

      # No dependencies, so nothing to install — just the invariant tests.
      - run: npm test

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The GitHub Release page follows npm: its notes are this version's
      # CHANGELOG section (releases 0.12-0.14 were published to npm only).
      - name: GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          printf '\nInstall: `npm i -g waypost@%s`\n' "$v" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "waypost $GITHUB_REF_NAME" --notes-file notes.md --latest
