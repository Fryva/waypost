name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # the full suite takes about 25 min on a hosted runner (2026-10-11)
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No dependencies: nothing to install.
      - run: npm test
      # The vault gate: `.waypost/` is per checkout, so a fresh clone binds the
      # vault first; `doctor --vault` exits 1 on any issue (and on no usable vault).
      - run: node bin/waypost bind docs/vault
      - run: node bin/waypost doctor --vault
